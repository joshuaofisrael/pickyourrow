name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: List new or changed URLs for IndexNow
        run: node scripts/indexnow-diff.mjs

      - name: Keep IndexNow URL list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Get IndexNow URL list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 3badd7577e7dbb999ce85bf50893ea95
        run: node scripts/indexnow-submit.mjs

